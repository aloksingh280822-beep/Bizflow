<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2437">
<title>BizFlow Books</title>
<style>
:root{
  --bg:#f6f7fb;--cd:#fff;--tx:#21263c;--mu:#6c718a;--bd:#e6e8f0;--bd2:#d6dae6;
  --pr:#408dfb;--prd:#2c76e0;--pr2:#ecf3ff;--th:#f8f9fc;--hv:#f4f8ff;
  --nv:#1f2437;--nv2:#2b3149;--nvt:#c3c9dc;--nvm:#8a92ad;
  --ok:#1e9e5a;--ok2:#e8f6ee;--er:#e5484d;--er2:#fdecec;--wn:#e8762c;--wn2:#fdf1e7;
  --sh:0 1px 2px rgba(31,36,55,.06);--r:6px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#12151f;--cd:#1a1e2b;--tx:#e6e9f2;--mu:#99a1ba;--bd:#2a3043;--bd2:#353c52;
  --pr:#5b9dff;--prd:#3f86f5;--pr2:#1d2a45;--th:#1f2433;--hv:#212841;
  --nv:#0f121b;--nv2:#1c2131;--ok2:#14301f;--er2:#3a1c1e;--wn2:#3a2717;color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#12151f;--cd:#1a1e2b;--tx:#e6e9f2;--mu:#99a1ba;--bd:#2a3043;--bd2:#353c52;
  --pr:#5b9dff;--prd:#3f86f5;--pr2:#1d2a45;--th:#1f2433;--hv:#212841;
  --nv:#0f121b;--nv2:#1c2131;--ok2:#14301f;--er2:#3a1c1e;--wn2:#3a2717;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a{color:var(--pr);text-decoration:none}a:hover{text-decoration:underline}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
#app{display:flex;min-height:100%}
/* ---------- sidebar ---------- */
#side{width:224px;flex:none;background:var(--nv);color:var(--nvt);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;padding-top:var(--sat);z-index:40}
#side .org{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06)}
#side .org .lg{width:30px;height:30px;border-radius:7px;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
#side .org b{display:block;color:#fff;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#side .org small{color:var(--nvm);font-size:11.5px}
#side nav{padding:6px 0 18px}
#side .nh,#side a{display:flex;align-items:center;gap:11px;padding:8px 16px;color:var(--nvt);font-size:13.5px;cursor:pointer;user-select:none;text-decoration:none;border-left:3px solid transparent}
#side .nh:hover,#side a:hover{background:var(--nv2);color:#fff}
#side .nh .cv{margin-left:auto;font-size:10px;color:var(--nvm);transition:transform .15s}
#side .nh.open .cv{transform:rotate(90deg)}
#side .nh.act{color:#fff}
#side a.d1{padding:6px 16px 6px 45px;font-size:13px;color:#aab2c9}
#side a.on{background:rgba(64,141,251,.16);color:#fff;border-left-color:var(--pr)}
#side a.on.d0{background:var(--pr);border-left-color:var(--pr)}
#side .bd{background:var(--wn);color:#fff;border-radius:9px;font:600 10.5px/17px Arial;padding:0 6px;margin-left:auto}
#side kbd{margin-left:auto;font:10.5px ui-monospace,monospace;color:var(--nvm)}
#scrim{display:none}
/* ---------- header ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;gap:8px;align-items:center;padding:8px 18px;padding-top:calc(8px + var(--sat));background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:30;min-height:52px}
#top h1{font-size:17px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttlw{flex:1;min-width:0}
#gsw{position:relative;width:min(360px,34vw)}
#gs{width:100%;padding:7px 10px 7px 32px;border-radius:18px;background:var(--th);border:1px solid var(--bd)}
#gsw svg{position:absolute;left:10px;top:8px;width:16px;height:16px;color:var(--mu)}
#gsr{position:absolute;top:38px;left:0;right:0;background:var(--cd);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 28px rgba(20,25,45,.18);max-height:70vh;overflow:auto;display:none;z-index:60}
#gsr.on{display:block}
#gsr .gh{padding:7px 12px 3px;font-size:11px;color:var(--mu);font-weight:600}
#gsr a{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;color:var(--tx);text-decoration:none}
#gsr a:hover,#gsr a.k{background:var(--hv)}
#perbox{display:flex;gap:6px;align-items:center}
#perbox input{width:132px}
.ic{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 9px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:var(--r);cursor:pointer;font:inherit;white-space:nowrap}
.ic:hover{background:var(--hv)}
.ic.newb{background:var(--pr);border-color:var(--pr);color:#fff;border-radius:50%;width:32px;padding:0}
.ic.newb:hover{background:var(--prd)}
#sync{font-size:12px;color:var(--mu);white-space:nowrap;cursor:default;display:inline-flex;align-items:center;gap:5px}
#sync.bad{color:var(--wn);cursor:pointer;font-weight:600}
#sync .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
#sync.busy .dot{background:var(--pr);animation:pl 1s infinite}
#sync.bad .dot{background:var(--wn)}
@keyframes pl{50%{opacity:.3}}
#mb{display:none}
.menu{position:absolute;background:var(--cd);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 28px rgba(20,25,45,.18);padding:4px;z-index:70;min-width:180px}
.menu button{display:flex;width:100%;gap:9px;align-items:center;background:none;border:0;padding:8px 10px;font:inherit;color:var(--tx);cursor:pointer;border-radius:5px;text-align:left}
.menu button:hover{background:var(--hv)}
/* ---------- content ---------- */
#view{padding:18px 20px 70px;width:100%;max-width:1440px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 14px}
.ph h2{font-size:19px;font-weight:600;margin:0 auto 0 0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:600}
.card h4{margin:14px 0 8px;font-size:13px}
.flat{padding:0;overflow:hidden}
.flat>.sc{border-radius:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd2);background:var(--cd);color:var(--tx);border-radius:var(--r);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;line-height:1.35}
.btn:hover{background:var(--hv)}
.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}
.btn.p:hover{background:var(--prd)}
.btn.d{color:var(--er)}
.btn.g{color:#fff;background:#25a35a;border-color:#25a35a}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg.i{width:15px;height:15px}
input,select,textarea{font:inherit;font-size:13px;color:var(--tx);background:var(--cd);border:1px solid var(--bd2);border-radius:var(--r);padding:6px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px}
.fg label,.lb{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:4px}
.fg label input,.fg label select,.fg label textarea{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{background:var(--th);text-align:left;font-weight:600;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0;z-index:1;white-space:nowrap}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr.cl{cursor:pointer}
table.t tr.cl:hover td{background:var(--hv)}
table.t tr.gh td{font-weight:600;background:var(--th)}
table.t tr.tot td{font-weight:700;border-top:1px solid var(--tx);border-bottom:3px double var(--tx)}
table.t tr.sub td{font-weight:600;border-top:1px solid var(--bd2)}
table.t td.ind{padding-left:26px}
table.t td.ind2{padding-left:44px;color:var(--mu)}
table.lines td{padding:4px 5px}
table.lines input,table.lines select{width:100%}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kp .card{margin:0;cursor:pointer;padding:13px 15px}
.kp small{color:var(--mu);font-size:12px}
.kp b{display:block;font-size:19px;margin-top:4px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.mu{color:var(--mu)}.ok{color:var(--ok)}.er{color:var(--er)}.wn{color:var(--wn)}.b{font-weight:600}
.st{font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--pr2);color:var(--pr);font-size:11.5px;white-space:nowrap}
.tag.ok{background:var(--ok2);color:var(--ok)}.tag.er{background:var(--er2);color:var(--er)}.tag.wn{background:var(--wn2);color:var(--wn)}
.totbox{margin-left:auto;min-width:290px}
.totbox div{display:flex;justify-content:space-between;padding:3px 0}
.totbox .g{font-size:16px;font-weight:700;border-top:1px solid var(--bd);margin-top:5px;padding-top:7px}
.note{border-left:3px solid var(--pr);background:var(--pr2);padding:10px 14px;border-radius:4px;margin-bottom:14px}
.note.w{border-color:var(--wn);background:var(--wn2)}
.note.e{border-color:var(--er);background:var(--er2)}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);background:#232a3f;color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.on{opacity:1}#toast.bad{background:var(--er)}
#modal{position:fixed;inset:0;background:rgba(15,20,35,.5);display:none;align-items:flex-start;justify-content:center;z-index:80;overflow:auto;padding:40px 12px}
#modal.on{display:flex}
#modal>.card{width:min(760px,100%);box-shadow:0 14px 48px rgba(0,0,0,.3)}
#modal>.card.wide{width:min(1100px,100%)}
.prog{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pr);width:0}
.inv{background:#fff;color:#111;padding:20px;border:1px solid var(--bd);border-radius:6px;overflow:auto}
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cos .card{cursor:pointer;margin:0}
.cos .card:hover{border-color:var(--pr)}
/* dashboard */
.dw .card h3{display:flex;justify-content:space-between;align-items:center}
.agebar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--bd);margin:10px 0 12px}
.agebar i{display:block;height:100%}
.ages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ages div{border-left:1px solid var(--bd);padding-left:10px}
.ages div:first-child{border-left:0;padding-left:0}
.ages small{display:block;color:var(--mu);font-size:11.5px}
.ages b{font-size:14.5px;font-variant-numeric:tabular-nums}
.ages .od{color:var(--wn)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mu);font-size:10.5px}
.lgd{display:flex;gap:14px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:4px}
.hbar i{display:block;height:100%;background:var(--pr)}
/* split view (list + document) */
.split{display:grid;grid-template-columns:300px 1fr;gap:0;border:1px solid var(--bd);border-radius:8px;background:var(--cd);overflow:hidden;min-height:calc(100vh - 120px)}
.split .mini{border-right:1px solid var(--bd);overflow-y:auto;max-height:calc(100vh - 120px)}
.split .mini .mh{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--cd);z-index:1}
.split .mini a{display:block;padding:10px 12px;border-bottom:1px solid var(--bd);color:var(--tx);text-decoration:none}
.split .mini a:hover{background:var(--hv)}
.split .mini a.on{background:var(--pr2);box-shadow:inset 3px 0 0 var(--pr)}
.split .mini .l1,.split .mini .l2{display:flex;justify-content:space-between;gap:8px}
.split .mini .l2{font-size:12px;color:var(--mu);margin-top:2px}
.split .docp{min-width:0;display:flex;flex-direction:column}
.split .tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd)}
.split .docw{padding:18px;overflow:auto;background:var(--th);flex:1}
.split .docw .inv{max-width:860px;margin:0 auto;box-shadow:0 1px 8px rgba(0,0,0,.08)}
/* reports */
.rc{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.rc .card{margin:0}
.rc .card h3{font-size:13.5px;margin-bottom:6px}
.rc a{display:block;padding:5px 0;font-size:13px}
.rh{text-align:center;margin:6px 0 18px}
.rh .co{color:var(--mu);font-size:13px}
.rh h2{font-size:20px;font-weight:600;margin:4px 0}
.rh .pd{color:var(--mu);font-size:12.5px}
.rep table.t th{background:transparent;border-bottom:1px solid var(--bd2)}
.rep table.t td{border-bottom:1px solid transparent}
.rep table.t tr:hover td{background:var(--hv)}
.rep table.t tr.gh td{background:transparent;padding-top:14px;border-bottom:0}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin:-4px 0 14px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none}
.tabs a.on{color:var(--pr);border-bottom-color:var(--pr);font-weight:600}
/* drop zone */
.drop{border:1.5px dashed var(--bd2);border-radius:8px;padding:22px;text-align:center;color:var(--mu);cursor:pointer;display:block}
.drop:hover,.drop.ov{border-color:var(--pr);background:var(--pr2);color:var(--pr)}
/* bottom nav (phones) */
#bnav{display:none}
@media(max-width:1280px){#perbox input{display:none}#perbox.cust input{display:block}#ttlw{min-width:140px}}
@media(max-width:1100px){
  .split{grid-template-columns:1fr}
  .split .mini{display:none}
  .three{grid-template-columns:1fr}
  #gsw{width:min(260px,30vw)}
}
@media(max-width:900px){.two{grid-template-columns:1fr}}
@media(max-width:760px){
  html,body{font-size:14.5px}
  input,select,textarea{font-size:16px;padding:8px 10px}
  .btn{padding:8px 13px;font-size:14px}
  .btn.sm{padding:5px 10px;font-size:13px}
  #side{position:fixed;left:-260px;width:256px;transition:left .2s}
  #side.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
  #scrim.on{display:block;position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:35}
  #mb{display:inline-flex}
  #top{padding:6px 10px;padding-top:calc(6px + var(--sat));gap:6px;flex-wrap:wrap}
  #top .hx{display:none}
  #gsw{order:9;width:100%}
  #perbox{order:10;width:100%}
  #perbox select{flex:1}
  #perbox input{flex:1;width:auto;display:none}
  #perbox.cust input{display:block}
  #toast{bottom:calc(84px + var(--sab))}
  .flat .row input[type=search]{max-width:none!important;flex:1 1 100%}
  #view{padding:12px 10px calc(84px + var(--sab))}
  .card{padding:13px 13px;border-radius:10px}
  .ph h2{font-size:17px}
  .kp{grid-template-columns:1fr 1fr;gap:8px}
  .kp b{font-size:16px}
  .ages{grid-template-columns:repeat(3,1fr)}
  .totbox{min-width:0;width:100%}
  #modal{padding:0;align-items:stretch}
  #modal>.card{border-radius:0;min-height:100%;margin:0;padding-top:calc(14px + var(--sat))}
  #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);z-index:30;padding-bottom:var(--sab)}
  #bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;color:var(--mu);font-size:10.5px;text-decoration:none}
  #bnav a.on{color:var(--pr)}
  #bnav a.plus span{width:44px;height:44px;margin-top:-18px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(64,141,251,.45)}
  #bnav a.plus svg{width:22px;height:22px}
  /* list tables become cards */
  table.lst thead{display:none}
  table.lst,table.lst tbody,table.lst tr,table.lst td{display:block;width:100%}
  table.lst tr{border-bottom:1px solid var(--bd);padding:9px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
  table.lst td{border:0;padding:0;text-align:left!important}
  table.lst td.r{text-align:right!important}
  table.lst td[data-l]:not(.m1)::before{content:attr(data-l) ": ";color:var(--mu);font-size:12px}
  table.lst td.m1{font-weight:600}
  table.lst td.hm{display:none}
  table.lst tr.tot{display:flex;justify-content:space-between}
  /* voucher lines become stacked cards */
  table.lines thead{display:none}
  table.lines,table.lines tbody,table.lines tr{display:block;width:100%}
  table.lines tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:8px;position:relative}
  table.lines td{display:flex;flex-direction:column;padding:0;border:0}
  table.lines td[data-l]::before{content:attr(data-l);font-size:11px;color:var(--mu);margin-bottom:2px}
  table.lines td.wide{grid-column:1/-1}
  table.lines td.no{display:none}
  table.lines td.x{position:absolute;right:6px;top:6px}
  table.lines input{width:100%!important}
}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  #side,#top,#bnav,#scrim,.noprint,.btn,.tb{display:none!important}
  #view{padding:0;max-width:none}
  .card{border:0;box-shadow:none;padding:0}
  body,html{background:#fff}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
